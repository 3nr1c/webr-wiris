<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Restricted R Console</title>

  <!-- HARD NETWORK LOCKDOWN:
       Allows loading webR ONLY from webr.r-wasm.org.
       Blocks ALL external APIs, datasets, webhooks, and third-party requests. -->
  <meta http-equiv="Content-Security-Policy" content="
    default-src 'self';
    script-src 'self' 'unsafe-inline' 'unsafe-eval' 'wasm-unsafe-eval' https://webr.r-wasm.org;
    connect-src 'self' https://webr.r-wasm.org;
    worker-src 'self' blob: https://webr.r-wasm.org;
    style-src 'self' 'unsafe-inline';
    img-src 'self' data:;
    object-src 'none';
    base-uri 'none';
  " />

  <style>
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0;
      padding: 12px;
      background: #f8f9fa;
      color: #212529;
      display: flex;
      flex-direction: column;
      height: 100vh;
    }
    .toolbar {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 10px;
      flex-wrap: wrap;
    }
    button {
      background: #0d6efd;
      color: white;
      border: none;
      padding: 7px 14px;
      border-radius: 5px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
    }
    button:disabled { background: #6c757d; cursor: not-allowed; }
    button.secondary { background: #6c757d; }
    #status {
      font-size: 13px;
      color: #495057;
      margin-left: auto;
    }
    .workspace {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      flex: 1;
      min-height: 0;
    }
    .panel {
      display: flex;
      flex-direction: column;
      background: #ffffff;
      border: 1px solid #dee2e6;
      border-radius: 6px;
      overflow: hidden;
    }
    .panel-header {
      background: #e9ecef;
      padding: 6px 10px;
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: #495057;
      border-bottom: 1px solid #dee2e6;
    }
    textarea#editor {
      flex: 1;
      width: 100%;
      border: none;
      padding: 10px;
      font-family: "Fira Code", "Consolas", monospace;
      font-size: 14px;
      resize: none;
      outline: none;
    }
    pre#console {
      flex: 1;
      margin: 0;
      padding: 10px;
      overflow-y: auto;
      font-family: "Fira Code", "Consolas", monospace;
      font-size: 13px;
      white-space: pre-wrap;
      word-break: break-word;
      color: #111;
    }
    @media (max-width: 700px) {
      .workspace { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

  <div class="toolbar">
    <button id="run-btn" disabled>▶ Run R Code</button>
    <button id="clear-btn" class="secondary">Clear Output</button>
    <span id="status">Loading webR environment...</span>
  </div>

  <div class="workspace">
    <div class="panel">
      <div class="panel-header">R Script Editor</div>
      <textarea id="editor" spellcheck="false" placeholder="# Write your base R code here..."></textarea>
    </div>

    <div class="panel">
      <div class="panel-header">Console Output</div>
      <pre id="console"></pre>
    </div>
  </div>

  <script type="module">
    import { WebR } from 'https://webr.r-wasm.org/v0.4.2/webr.mjs';

    const statusEl = document.getElementById('status');
    const runBtn = document.getElementById('run-btn');
    const clearBtn = document.getElementById('clear-btn');
    const editorEl = document.getElementById('editor');
    const consoleEl = document.getElementById('console');

    // 1. Parse WirisQuizzes URL query parameters
    function parseWirisValue(raw) {
      const trimmed = raw.trim();
      if ((trimmed.startsWith('{') && trimmed.endsWith('}')) ||
          (trimmed.startsWith('[') && trimmed.endsWith(']'))) {
        const inner = trimmed.slice(1, -1).trim();
        return inner.length ? `c(${inner})` : 'c()';
      }
      if (!isNaN(Number(trimmed)) && trimmed !== '') {
        return trimmed;
      }
      return `"${trimmed.replace(/\\/g, '\\\\').replace(/"/g, '\\"')}"`;
    }

    function buildPreloadScript() {
      const params = new URLSearchParams(window.location.search);
      const assignments = [];
      let customCode = '';

      for (const [key, value] of params.entries()) {
        if (key === 'code') {
          customCode = value;
          continue;
        }
        if (/^[a-zA-Z.][a-zA-Z0-9._]*$/.test(key)) {
          assignments.push(`${key} <- ${parseWirisValue(value)}`);
        }
      }

      if (assignments.length === 0 && !customCode) {
        return '# Base R environment ready.\nx <- c(10, 20, 30, 40)\nmean(x)\n';
      }

      let script = '';
      if (assignments.length > 0) {
        script += '# Pre-loaded variables:\n' + assignments.join('\n') + '\n\n';
      }
      script += customCode || '# Write your R solution below:\n';
      return script;
    }

    editorEl.value = buildPreloadScript();

    // 2. Initialize webR
    const webR = new WebR();
    await webR.init();

    // 3. HARDEN THE R ENVIRONMENT BEFORE STUDENT ACCESS
    // - Blocks package installation (install.packages, webr::install, webr::mount)
    // - Blocks loading non-base packages via library() or require()
    // - Blocks shell/terminal execution (system, system2, pipe, shell)
    // - Blocks network connections (url, socketConnection, download.file)
    await webR.evalRVoid(`
      local({
        allowed_pkgs <- c("base", "stats", "utils", "graphics", "grDevices", "methods", "datasets")

        deny <- function(msg) {
          function(...) stop(msg, call. = FALSE)
        }

        # Lock bindings in base/utils/webr namespaces and shadow in .GlobalEnv
        lock_and_shadow <- function(name, fn, env_name = "base") {
          assign(name, fn, envir = .GlobalEnv)
          lockBinding(name, .GlobalEnv)
          if (env_name %in% loadedNamespaces()) {
            ns <- asNamespace(env_name)
            if (exists(name, envir = ns, inherits = FALSE)) {
              unlockBinding(name, ns)
              assign(name, fn, envir = ns)
              lockBinding(name, ns)
            }
          }
        }

        # 1. Disable package installation
        lock_and_shadow("install.packages", deny("Package installation is disabled in this exam."), "utils")
        lock_and_shadow("install", deny("webR package installation is disabled in this exam."), "webr")
        lock_and_shadow("mount", deny("Mounting external images is disabled in this exam."), "webr")

        # 2. Restrict library() and require() to base R packages only
        restricted_library <- function(package, help, pos = 2, lib.loc = NULL, character.only = FALSE, ...) {
          pkg_name <- if (character.only) as.character(package) else as.character(substitute(package))
          if (!(pkg_name %in% allowed_pkgs)) {
            stop(paste0("External package '", pkg_name, "' is not allowed. Only base R packages may be used."), call. = FALSE)
          }
          base::library(package = pkg_name, pos = pos, lib.loc = lib.loc, character.only = TRUE, ...)
        }

        restricted_require <- function(package, lib.loc = NULL, quietly = FALSE, warn.conflicts = TRUE, character.only = FALSE, ...) {
          pkg_name <- if (character.only) as.character(package) else as.character(substitute(package))
          if (!(pkg_name %in% allowed_pkgs)) {
            stop(paste0("External package '", pkg_name, "' is not allowed. Only base R packages may be used."), call. = FALSE)
          }
          base::require(package = pkg_name, lib.loc = lib.loc, quietly = quietly, warn.conflicts = warn.conflicts, character.only = TRUE, ...)
        }

        assign("library", restricted_library, envir = .GlobalEnv)
        lockBinding("library", .GlobalEnv)
        assign("require", restricted_require, envir = .GlobalEnv)
        lockBinding("require", .GlobalEnv)

        # 3. Disable terminal / shell commands
        lock_and_shadow("system", deny("Terminal/shell execution is disabled."), "base")
        lock_and_shadow("system2", deny("Terminal/shell execution is disabled."), "base")
        lock_and_shadow("pipe", deny("Shell pipes are disabled."), "base")
        lock_and_shadow("shell", deny("Terminal/shell execution is disabled."), "base")

        # 4. Disable network I/O functions at the R layer (in addition to browser CSP)
        lock_and_shadow("download.file", deny("Internet access is disabled."), "utils")
        lock_and_shadow("url", deny("Internet access is disabled."), "base")
        lock_and_shadow("socketConnection", deny("Network sockets are disabled."), "base")
      })
    `);

    const shelter = await new webR.Shelter();
    statusEl.textContent = 'Ready (Restricted Base R)';
    runBtn.disabled = false;

    // 4. Run student code (text console only, no graphics device)
    async function runRCode() {
      const code = editorEl.value;
      if (!code.trim()) return;

      runBtn.disabled = true;
      statusEl.textContent = 'Running...';
      consoleEl.textContent = '';

      try {
        const result = await shelter.captureR(code, {
          withAutoprint: true,
          captureStreams: true,
          captureConditions: false
        });

        const textOutput = result.output
          .filter(line => line.type === 'stdout' || line.type === 'stderr')
          .map(line => line.data)
          .join('\n');

        consoleEl.textContent = textOutput || '(Executed with no console output)';
      } catch (err) {
        consoleEl.textContent = 'Error:\n' + err.message;
      } finally {
        await shelter.purge();
        runBtn.disabled = false;
        statusEl.textContent = 'Ready (R script editor)';
      }
    }

    runBtn.addEventListener('click', runRCode);
    clearBtn.addEventListener('click', () => {
      consoleEl.textContent = '';
    });

    editorEl.addEventListener('keydown', (e) => {
      if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
        e.preventDefault();
        runRCode();
      }
    });

    if (window.location.search.length > 1) {
      await runRCode();
    }
  </script>
</body>
</html>
